name: CI

on:
  pull_request:
  # development is where work is approved, and main is what deploys. Checking
  # both after every merge catches two changes that pass alone but break together.
  push:
    branches: [main, development]
  # Advisories are published without anyone touching the code, so the audit
  # also runs daily rather than only when a pull request happens to open.
  schedule:
    - cron: "0 6 * * *"

# Read-only by default. Nothing here needs to write to the repository.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    # The code checks have nothing new to say on a scheduled run.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be moved to
      # point at different code, a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install exactly what the lockfile specifies
        run: npm ci

      - name: Generate Prisma clients
        run: npx prisma generate --schema prisma/schema.prisma

      # next-env.d.ts is generated rather than committed, and it is what declares
      # image imports and route types. Without it every `import x from "*.png"`
      # fails the type check on a fresh checkout.
      - name: Generate Next.js types
        working-directory: frontend
        run: npx next typegen

      - name: Type check frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Type check backend
        working-directory: backend
        run: npx tsc --noEmit

      - name: Lint frontend
        run: npm run lint --workspace frontend

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Critical only. Three high advisories in Prisma's dependencies have no
      # fix yet, so a `high` gate would stay red for reasons nobody can act on.
      # Reads the lockfile, so no install is needed.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
